<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="452" viewBox="0 0 860 452" role="img" aria-labelledby="title desc" lang="ru">
<title id="title">«Берег» — как выбрать «Отлив» для финала</title>
<desc id="desc">Нажмите по очереди на обе волны. Сегодня верхняя запись длится восемь секунд, нижняя — тринадцать. Вчера список сортировали по времени добавления. Спросите Марину, какую длительность она выбрала, затем перетащите одну подтверждённую запись за точки слева в поле «Финал».</desc>
<style>
text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#173538}.title{font-weight:700;font-size:31px;letter-spacing:-1px}.step{font-size:18px;font-weight:700;letter-spacing:-.4px}.body{font-size:15px}.small{font-size:12px;fill:#4d6565}.mono{font-family:"DejaVu Sans Mono",monospace;font-size:15px}.number{font-size:13px;font-weight:700;fill:white;text-anchor:middle}
</style>
<defs>
  <clipPath id="frame"><rect x="22" y="91" width="486" height="337" rx="9"/></clipPath>
  <g id="grip">
    <rect x="-8" y="-14" width="25" height="28" rx="6" fill="#fff3e8" stroke="#ad542e" stroke-width="1.5"/>
    <g fill="#7f4329"><circle cx="1" cy="-5" r="1.75"/><circle cx="7" cy="-5" r="1.75"/><circle cx="1" cy="0" r="1.75"/><circle cx="7" cy="0" r="1.75"/><circle cx="1" cy="5" r="1.75"/><circle cx="7" cy="5" r="1.75"/></g>
  </g>
  <g id="player"><rect width="182" height="32" rx="6" fill="#e5f5ef" stroke="#197c73" stroke-width="1.6"/><path d="M11 9l10 7-10 7z" fill="#197c73"/></g>
</defs>
<rect width="860" height="452" fill="#faf9f5"/>
<text x="22" y="27" font-size="12" font-weight="bold" letter-spacing="1.7" style="fill:#49645f">ЗВУКОВАЯ ОТКРЫТКА «БЕРЕГ»</text>
<text x="21" y="65" class="title">Какой «Отлив» поставить в финал</text>
<g clip-path="url(#frame)">
  <rect x="22" y="91" width="486" height="337" fill="#f2f6f3"/>
  <rect x="22" y="91" width="486" height="42" fill="#173c40"/>
  <text x="39" y="119" style="fill:white" font-size="21" font-weight="bold">Отзвук</text>
  <text x="143" y="118" style="fill:#d3e8e4" font-size="14">Фонотека / Берег</text>
  <text x="39" y="166" font-size="21" font-weight="bold">Записи</text>
  <text x="492" y="164" text-anchor="end" class="small">Сортировка по длительности ↑</text>
  <rect x="38" y="179" width="454" height="104" rx="7" fill="white" stroke="#bed0cb"/>
  <path d="M38 231H492" stroke="#d4dfdb"/>
  <use xlink:href="#grip" x="57" y="205"/><use xlink:href="#grip" x="57" y="257"/>
  <text x="86" y="211" font-weight="bold" font-size="18">Отлив</text>
  <text x="86" y="263" font-weight="bold" font-size="18">Отлив</text>
  <use xlink:href="#player" x="214" y="189"/><use xlink:href="#player" x="214" y="241"/>
  <g fill="none" stroke="#197c73" stroke-width="3" stroke-linecap="round">
    <path transform="translate(221 205) scale(.66 .72)" d="M32 -2v4m8 -6v8m8 -14v20m8 -24v28m8 -21v14m8 -12v10m8 -9v8m8 -17v26m8 -23v20m8 -16v12m8 -11v10m8 -12v14m8 -18v22m8 -19v16m8 -12v8m8 -10v12m8 -17v22m8 -14v6m8 -5v4m8 -5v6m8 -9v12m8 -11v10m8 -9v8m8 -7v6m8 -5v4m8 -4v4m8 -4v4m8 -3v2"/>
    <path transform="translate(221 257) scale(.66 .72)" d="M32 -2v4m8 -5v6m8 -8v10m8 -12v14m8 -11v8m8 -5v2m8 -4v6m8 -10v14m8 -16v18m8 -24v30m8 -28v26m8 -22v18m8 -17v16m8 -11v6m8 -9v12m8 -18v24m8 -21v18m8 -12v6m8 -6v6m8 -11v16m8 -17v18m8 -14v10m8 -7v4m8 -5v6m8 -7v8m8 -7v6m8 -5v4m8 -3v2"/>
  </g>
  <text x="478" y="210" class="mono" text-anchor="end">00:08</text>
  <text x="478" y="262" class="mono" text-anchor="end">00:13</text>
  <text x="39" y="303" class="small">Нажмите на волну, чтобы прослушать запись.</text>
  <text x="39" y="340" font-size="20" font-weight="bold">Финал</text>
  <rect x="38.5" y="350.5" width="453" height="60" rx="7" fill="#fbf3e9" stroke="#ad542e" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="265" y="386" text-anchor="middle" font-size="14">Перетащите сюда запись за точки слева</text>
</g>
<rect x="22" y="91" width="486" height="337" rx="9" fill="none" stroke="#c3d0c9"/>
<g>
  <circle cx="544" cy="105" r="12" fill="#197c73"/><text x="544" y="110" class="number">1</text>
  <text x="566" y="111" class="step">Прослушайте обе записи</text>
  <text x="566" y="138" class="body">Нажмите по очереди на обе волны.</text>
  <path d="M532 157h304" stroke="#cdd3cc"/>
  <circle cx="544" cy="180" r="12" fill="#3b5350"/><text x="544" y="185" class="number">2</text>
  <text x="566" y="186" class="step">Уточните у Марины</text>
  <text x="566" y="213" class="body">Вчера — по времени добавления,</text>
  <text x="566" y="234" class="body">сегодня — по длительности.</text>
  <path d="M567 249v42" stroke="#6e8881" stroke-width="3"/>
  <text x="578" y="266" class="body" font-weight="bold">«Какой „Отлив“ берём</text>
  <text x="578" y="287" class="body" font-weight="bold">в финал — 00:08 или 00:13?»</text>
  <path d="M532 306h304" stroke="#cdd3cc"/>
  <circle cx="544" cy="330" r="12" fill="#ad542e"/><text x="544" y="335" class="number">3</text>
  <text x="566" y="336" class="step">Перетащите выбранную</text>
  <text x="566" y="362" class="body">00:08 — верхняя строка.</text>
  <text x="566" y="383" class="body">00:13 — нижняя строка.</text>
  <text x="566" y="409" class="body">Тяните за точки слева в «Финал».</text>
</g>
</svg>
