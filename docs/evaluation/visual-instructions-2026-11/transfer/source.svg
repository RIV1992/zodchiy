<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Фонотека «Отзвук» — подборка для финала</title>
  <desc id="desc">Две записи «Отлив» отсортированы по возрастанию длительности. Верхняя длится 00:08, нижняя 00:13. У каждой есть захват слева, волна справа. Внизу пустая область «Финал».</desc>
  <style>
    text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#132d32}
    .caption{font-size:15px;fill:#466164}
    .name{font-size:24px;font-weight:bold}
    .duration{font-size:20px;font-family:"DejaVu Sans Mono",monospace}
    .wave{fill:none;stroke:#197c73;stroke-width:3;stroke-linecap:round}
  </style>
  <defs>
