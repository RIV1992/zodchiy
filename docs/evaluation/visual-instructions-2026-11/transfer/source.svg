      <circle cx="0" cy="0" r="2.2"/><circle cx="7" cy="0" r="2.2"/>
      <circle cx="0" cy="7" r="2.2"/><circle cx="7" cy="7" r="2.2"/>
    </g>
  </defs>
  <rect width="860" height="460" rx="14" fill="#f3f6f4"/>
  <path d="M0 14Q0 0 14 0H846Q860 0 860 14V64H0Z" fill="#173c40"/>
