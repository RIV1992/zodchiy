  <rect x="32" y="130" width="796" height="132" rx="10" fill="#fff" stroke="#bed0cb"/>
  <path d="M32 196H828" stroke="#d4dfdb"/>
  <use href="#grip" x="58" y="163"/><use href="#grip" x="58" y="229"/>
  <text x="90" y="172" class="name">Отлив</text>
  <text x="90" y="238" class="name">Отлив</text>
  <g transform="translate(374 163)">
